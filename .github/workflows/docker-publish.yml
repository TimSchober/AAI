# Builds every service image and pushes it to Docker Hub.
#
# All five images share one Docker Hub repository and are told apart by their
# tag prefix, e.g. tims1014/repo_for_aai_lecture:backend. Each build
# publishes two tags: the moving <service> tag and an immutable
# <service>-<commit-sha> tag to roll back to.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - the Docker Hub account name
#   DOCKERHUB_TOKEN    - a Docker Hub access token with Read & Write scope
name: Publish Docker images

on:
  push:
    branches: [main]
  # Lets you publish from the Actions tab without pushing a commit.
  workflow_dispatch:

env:
  IMAGE: tims1014/repo_for_aai_lecture

concurrency:
  # A newer push to main makes an in-flight run obsolete.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One failing image should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - service: rag
            dockerfile: docker/Dockerfile.rag
          - service: jobsuche
            dockerfile: docker/Dockerfile.jobsuche
          - service: mcp
            dockerfile: docker/Dockerfile.mcp
          - service: backend
            dockerfile: docker/Dockerfile.backend
          - service: frontend
            dockerfile: docker/Dockerfile.frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # The Dockerfiles copy from the repository root, so the context is the
          # whole repo rather than the docker/ directory.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ matrix.service }}
            ${{ env.IMAGE }}:${{ matrix.service }}-${{ github.sha }}
          # Scoped per service so the five parallel builds do not evict each
          # other's layers from the shared Actions cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
