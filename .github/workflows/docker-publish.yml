# Builds every service image and pushes it to Docker Hub.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - the Docker Hub account name
#   DOCKERHUB_TOKEN    - a Docker Hub access token with Read & Write scope
name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: tims1014/repo_for_aai_lecture

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rag
            dockerfile: docker/Dockerfile.rag
          - service: jobsuche
            dockerfile: docker/Dockerfile.jobsuche
          - service: mcp
            dockerfile: docker/Dockerfile.mcp
          - service: backend
            dockerfile: docker/Dockerfile.backend
          - service: frontend
            dockerfile: docker/Dockerfile.frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ matrix.service }}
            ${{ env.IMAGE }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
